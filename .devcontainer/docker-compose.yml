services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      # Rails (rails/config/database.yml) reads these directly. Deliberately
      # NOT setting DATABASE_URL or PORT here: both var names are also used
      # by the Node app, and since they'd be container-wide (visible to every
      # process, not just one app), a shared DATABASE_URL gets silently
      # auto-merged into Rails' db config (wrong database) and a shared PORT
      # makes both servers fight over the same port. Node gets its equivalents
      # from .env instead (see post-create.sh), which stays process-scoped.
      RAILS_ENV: development
      PGHOST: db
      PGUSER: albers
      PGPASSWORD: albers
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: albers
      POSTGRES_PASSWORD: albers
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albers"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
